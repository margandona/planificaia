name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'public/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - '.firebaserc'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write functions .env from secrets
        run: |
          printf 'DEEPSEEK_API_KEY=%s\nGEMINI_API_KEY=%s\nGEMINI_FALLBACK_ENABLED=%s\n' \
            "${{ secrets.DEEPSEEK_API_KEY }}" \
            "${{ secrets.GEMINI_API_KEY }}" \
            "true" > functions/.env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Show active SA email
        run: node -e "const crypto=require('crypto');const j=JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));console.log('SA_EMAIL='+j.client_email);console.log('PK_SHA256='+crypto.createHash('sha256').update(j.private_key).digest('hex'));console.log('PROJECT_ID='+j.project_id)"

      - name: Deploy to Firebase
        run: |
          npx firebase-tools deploy --only hosting,functions --project planificacion-con-ia --force
